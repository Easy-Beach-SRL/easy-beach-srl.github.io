:root {
  --navy: #1C1554;
  --navy2: #2B2378;
  --blue: #0A22FF;
  --cream: #F3EACE;
  --yellow: #FFDB75;
  --violet: #7A5CFF;
  --pink: #FEB0E2;
  --sky: #008EFE;
  --lilac: #9591AF;
  --danger: #FF5A6E;
  --radius: 32px;
  --head: "Inter", "Segoe UI", system-ui, sans-serif;
  --body: "Lato", "Segoe UI", system-ui, sans-serif;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  height: 100%;
  background: var(--navy);
  color: var(--cream);
  font-family: var(--body);
  overflow: hidden;
  user-select: none;
  -webkit-user-select: none;
  touch-action: manipulation;
}

/* ---------- sfondo fisso ---------- */
.decor { position: fixed; inset: 0; pointer-events: none; z-index: 0; }
.decor .logo { position: absolute; top: 3.2vh; left: 50%; transform: translateX(-50%); height: clamp(26px, 2.6vh, 50px); }
.decor .star { position: absolute; }
.decor .s1 { top: 9vh; left: 8vw; width: clamp(28px, 3vh, 56px); opacity: 0.9; }
.decor .s2 { top: 15vh; right: 9vw; width: clamp(30px, 3.4vh, 64px); }
.decor .s3 { top: 52vh; left: 5vw; width: clamp(20px, 2.2vh, 40px); }
.decor .s4 { top: 64vh; right: 6vw; width: clamp(18px, 1.8vh, 34px); opacity: 0.8; }
.decor .skyline { position: absolute; left: 0; right: 0; bottom: calc(clamp(24px, 2.4vh, 44px) * 2); width: 100%; height: 13vh; object-fit: cover; object-position: center bottom; opacity: 0.4; }
.decor .checker {
  position: absolute; left: 0; right: 0; bottom: 0;
  --sq: clamp(24px, 2.4vh, 44px);
  height: calc(var(--sq) * 2);
  background:
    conic-gradient(var(--cream) 25%, var(--navy) 0 50%, var(--cream) 0 75%, var(--navy) 0) 0 0 / calc(var(--sq) * 2) calc(var(--sq) * 2);
}

#app { position: relative; z-index: 1; height: 100%; }

.screen {
  height: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: safe center;
  gap: 3vh;
  overflow-y: auto;
  padding: 9vh 6vw 13vh;
  text-align: center;
  animation: enter 0.3s ease-out;
}

/* Solo opacità: niente movimenti del layout */
@keyframes enter { from { opacity: 0; } to { opacity: 1; } }
.screen.still { animation: none; }

h1, h2 { font-family: var(--head); font-weight: 800; letter-spacing: -0.03em; color: var(--cream); }
h1 { font-size: clamp(54px, min(7.6vh, 13vw), 150px); line-height: 0.98; }
h2 { font-size: clamp(34px, 4.6vh, 88px); line-height: 1.05; max-width: 18ch; }
.accent { color: var(--yellow); }
.lead { font-size: clamp(20px, 2.4vh, 42px); color: var(--cream); opacity: 0.85; max-width: 26ch; line-height: 1.3; }
.lead strong { color: var(--yellow); opacity: 1; }
.brand { font-family: var(--body); font-weight: 900; font-size: clamp(16px, 1.8vh, 32px); letter-spacing: 0.35em; text-transform: uppercase; color: var(--yellow); }

.hero { position: relative; display: flex; align-items: flex-end; justify-content: center; }
.mascot { height: clamp(110px, 13vh, 250px); width: auto; }
.mascot.big { height: clamp(120px, 11.5vh, 240px); }
.home { gap: 1.9vh; }
.home .big-btn { padding: 2.5vh 4vw; }
.hero .beer { position: absolute; right: -95%; bottom: 0; height: clamp(70px, 8.4vh, 160px); }

button { font: inherit; color: inherit; border: none; cursor: pointer; }
button:disabled { opacity: 0.35; cursor: default; }

.choices { display: flex; flex-direction: column; gap: 2.2vh; width: min(90%, 760px); }
.big-btn {
  display: flex; flex-direction: column; align-items: center; gap: 0.4vh;
  padding: 3vh 4vw; border-radius: 999px;
  background: var(--yellow); color: var(--navy);
}
.big-btn.alt { background: var(--blue); color: var(--cream); }
.big-btn:active:not(:disabled) { transform: scale(0.97); }
.btn-title { font-family: var(--head); font-size: clamp(28px, 3.8vh, 68px); font-weight: 800; letter-spacing: -0.02em; }
.btn-price { font-size: clamp(20px, 2.3vh, 40px); font-weight: 700; }

.primary-btn, .ghost-btn {
  font-family: var(--body); font-size: clamp(22px, 2.7vh, 46px); font-weight: 900;
  padding: 2.1vh 5vw; border-radius: 999px; min-width: 38%;
}
.primary-btn { background: var(--yellow); color: var(--navy); }
.ghost-btn { background: transparent; border: 3px solid var(--cream); color: var(--cream); }
.primary-btn:active, .ghost-btn:active { transform: scale(0.97); }
.row { display: flex; gap: 3vw; justify-content: center; flex-wrap: wrap; width: 100%; }

.banner { background: var(--danger); color: var(--navy); padding: 1.4vh 4vw; border-radius: 999px; font-size: clamp(20px, 2.4vh, 36px); font-weight: 900; }
.disclaimer { font-size: clamp(14px, 1.45vh, 24px); color: var(--lilac); max-width: 46ch; line-height: 1.35; }
.demo-tag { position: fixed; bottom: 6vh; right: 2vw; font-size: 14px; font-weight: 700; color: var(--navy); background: var(--pink); padding: 6px 12px; border-radius: 999px; z-index: 2; }
.demo-hint { font-size: clamp(16px, 1.8vh, 28px); color: var(--pink); max-width: 30ch; }

/* Numeri a larghezza fissa: cambiando cifra non si sposta nulla */
.count, .big-number, .value, .code-box span, .voucher, .ranking .v, .ranking .pos { font-variant-numeric: tabular-nums; }

.stepper { display: flex; align-items: center; gap: 5vw; }
.round { width: clamp(80px, 10vh, 170px); height: clamp(80px, 10vh, 170px); border-radius: 50%; background: var(--navy2); color: var(--cream); font-family: var(--head); font-size: clamp(44px, 6vh, 100px); font-weight: 800; }
.count, .big-number { font-family: var(--head); font-size: clamp(100px, 15vh, 270px); font-weight: 800; line-height: 1; color: var(--yellow); min-width: 2ch; }
.dots { display: flex; gap: 1.6vw; min-height: clamp(28px, 3.4vh, 56px); }
.dots span { width: clamp(28px, 3.4vh, 56px); height: clamp(28px, 3.4vh, 56px); border-radius: 50%; border: 3px solid var(--navy2); }

.pay-icon { line-height: 1; background: var(--navy2); border-radius: 50%; width: clamp(160px, 20vh, 360px); height: clamp(160px, 20vh, 360px); display: grid; place-items: center; }

.player-chip {
  display: inline-flex; align-items: center; gap: 1.4vw;
  background: var(--navy2); color: var(--cream); font-weight: 900;
  padding: 1vh 4vw 1vh 2vw; border-radius: 999px; font-size: clamp(20px, 2.5vh, 42px);
}
.player-chip::before { content: ""; width: 1.1em; height: 1.1em; border-radius: 50%; background: var(--c); }

.meter { width: min(86%, 820px); height: clamp(32px, 4vh, 68px); border-radius: 999px; background: var(--navy2); overflow: hidden; border: 3px solid var(--navy2); }
.meter-fill { height: 100%; width: 0; background: var(--violet); border-radius: 999px; }
.meter-fill.s33 { animation: pulse 0.9s ease-in-out infinite; width: 100% !important; background: var(--yellow); opacity: 0.6; }
.meter-fill.s34 { background: var(--yellow); }
.meter-fill.s35 { background: var(--danger); }
.meter-fill.s36 { background: var(--sky); animation: pulse 0.9s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: 0.25; } }

.result { gap: 2vh; }
.result .value { font-family: var(--head); font-size: clamp(72px, min(10.5vh, 17vw), 220px); font-weight: 800; letter-spacing: -0.04em; white-space: nowrap; line-height: 1; color: var(--yellow); }
.result .emoji { font-size: clamp(54px, 6vh, 120px); line-height: 1; }
.result .title { color: var(--cream); }

.qr { display: flex; flex-direction: column; align-items: center; gap: 1vh; color: var(--cream); font-weight: 700; font-size: clamp(16px, 1.8vh, 28px); }
.qr svg { width: clamp(140px, 13.5vh, 280px); height: auto; background: #fff; border-radius: 20px; padding: 10px; }

.ranking { list-style: none; width: min(92%, 860px); display: flex; flex-direction: column; gap: 1.4vh; }
.ranking li {
  display: grid; grid-template-columns: auto 1fr auto; grid-template-areas: "pos name v" "pos t v";
  align-items: center; column-gap: 3vw; text-align: left;
  background: var(--cream); color: var(--navy); border-radius: 26px; padding: 1.6vh 4vw;
}
.ranking li:first-child { background: var(--yellow); }
.ranking .pos { grid-area: pos; width: clamp(48px, 6vh, 100px); height: clamp(48px, 6vh, 100px); border-radius: 50%; background: var(--navy); color: var(--cream); display: grid; place-items: center; font-family: var(--head); font-weight: 800; font-size: clamp(24px, 3vh, 50px); box-shadow: inset 0 0 0 5px var(--c); }
.ranking .name { grid-area: name; font-family: var(--head); font-weight: 800; font-size: clamp(22px, 2.6vh, 44px); }
.ranking .t { grid-area: t; color: var(--navy); opacity: 0.75; font-size: clamp(16px, 1.9vh, 30px); }
.ranking .v { grid-area: v; font-family: var(--head); font-weight: 800; font-size: clamp(26px, 3.2vh, 54px); color: var(--blue); }

.settings p { font-size: clamp(18px, 2vh, 32px); color: var(--lilac); }
.settings strong { color: var(--cream); }

.link-btn { background: none; color: var(--yellow); font-weight: 700; font-size: clamp(18px, 2vh, 32px); text-decoration: underline; text-underline-offset: 6px; }
.error { color: var(--pink); }

.rule-list { list-style: none; width: min(92%, 860px); display: flex; flex-direction: column; gap: 1.6vh; text-align: left; }
.rule-list li { display: flex; align-items: center; gap: 3vw; background: var(--cream); color: var(--navy); border-radius: 26px; padding: 2vh 4vw; font-size: clamp(18px, 2.2vh, 36px); line-height: 1.3; }
.rule-list strong { color: var(--navy); font-weight: 900; }
.rule-list .ico { font-size: clamp(32px, 4vh, 68px); flex: none; width: clamp(60px, 7vh, 120px); height: clamp(60px, 7vh, 120px); border-radius: 50%; display: grid; place-items: center; background: var(--navy); }
.rule-list li:nth-child(2) .ico { background: var(--blue); }
.rule-list li:nth-child(3) .ico { background: var(--violet); }
.rule-list .ico svg { width: 72%; height: 72%; }
.pay-icon svg { width: 62%; height: 62%; }

.code-box { display: flex; gap: 1.6vw; }
.code-box span { width: clamp(52px, 6.4vh, 104px); height: clamp(70px, 8.4vh, 136px); border-radius: 18px; background: var(--cream); color: var(--navy); display: grid; place-items: center; font-family: var(--head); font-size: clamp(36px, 5vh, 80px); font-weight: 800; }
.keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1.4vh; width: min(80%, 560px); }
.key { background: var(--navy2); color: var(--cream); border-radius: 22px; padding: 2vh 0; font-family: var(--head); font-size: clamp(30px, 4vh, 64px); font-weight: 800; }
.key.ok { background: var(--yellow); color: var(--navy); }
.key:active:not(:disabled) { transform: scale(0.95); }

.voucher { font-family: var(--head); font-size: clamp(56px, 7.5vh, 140px); font-weight: 800; letter-spacing: 0.12em; color: var(--navy); background: var(--yellow); border-radius: var(--radius); padding: 1.4vh 5vw; }

/* Buono: più contenuti, spazi più stretti per non finire sullo skyline */
.voucher-screen { gap: 1.3vh; padding-top: 8vh; }
.voucher-screen h2 { font-size: clamp(30px, 4vh, 72px); }
.voucher-screen .voucher { font-size: clamp(48px, 6vh, 120px); padding: 1vh 5vw; }
.voucher-screen .qr svg { width: clamp(110px, 10vh, 210px); }

/* Schermo orizzontale: meno spazio in altezza */
@media (orientation: landscape) {
  .screen { gap: 2.2vh; padding: 8vh 6vw 12vh; }
  .home .hero { display: none; }
  h1 { font-size: clamp(44px, 9vh, 130px); }
  .decor .skyline { height: 11vh; }
}

</style>
</head>

            index += 1;

          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';

        buffer.put(0, 4);
      }

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);

      while (true) {

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

      return createBytes(buffer, rsBlocks);

        break;

        break;
      case 'Kanji' :
        newData = qrKanji(data);
        break;

      }
      return _modules[row][col];

    _this.getModuleCount = function() {
      return _moduleCount;
    };

    _this.make = function() {

        for (; typeNumber < 40; typeNumber++) {
          var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, _errorCorrectionLevel);

// ---- protocol.js ----
// Protocollo seriale del modulo Winsen ZE29A-C2H5OH (manuale v1.1).
// Seriale 9600 baud, 8 bit, 1 stop, nessuna parità. Ogni messaggio è lungo 9 byte:
//   invio:   FF 01 <comando> d1 d2 d3 d4 d5 <checksum>
//   risposta: FF <comando> d1 d2 d3 d4 d5 d6 <checksum>
// Checksum: (negato (somma byte 1..7)) + 1, sugli 8 bit bassi.

const CMD = {
  STATUS: 0x85,        // stato del modulo
  RESULT: 0x86,        // risultato del test (solo nello stato RESULT)
  SWITCH: 0x87,        // cambia stato
  READ_BLOW_TIME: 0x88,
  SET_BLOW_TIME: 0x89, // secondi di soffio, 1-10
  READ_THRESHOLDS: 0x90,
  SET_THRESHOLDS: 0x91,
  READ_PRESSURE: 0x92,
  SET_PRESSURE: 0x93,  // soglia di pressione del soffio, 5-200
};

const STATE = {
  IDLE: 0x31,        // in attesa di comandi
  PREHEAT: 0x32,     // preparazione, circa 10 s
  WAIT_BLOW: 0x33,   // aspetta il soffio, torna IDLE dopo 1 minuto
  BLOWING: 0x34,     // soffio in corso
  INTERRUPTED: 0x35, // soffio interrotto, dopo 3 s torna PREHEAT
  CALCULATING: 0x36, // calcolo, 2-5 s
  RESULT: 0x37,      // risultato leggibile per 20 s, poi IDLE
};

const FRAME_LENGTH = 9;
const START = 0xff;
const ADDRESS = 0x01;

function checksum(frame) {
  let sum = 0;
  for (let i = 1; i <= 7; i++) sum += frame[i];
  return (~sum + 1) & 0xff;
}

function buildCommand(cmd, data = []) {
  const frame = new Uint8Array(FRAME_LENGTH);
  frame[0] = START;
  frame[1] = ADDRESS;
  frame[2] = cmd;
  for (let i = 0; i < 5 && i < data.length; i++) frame[3 + i] = data[i] & 0xff;
  frame[8] = checksum(frame);
  return frame;
}

// Ricostruisce le risposte del modulo da un flusso di byte che può arrivare a pezzi.
// Se un frame ha il checksum sbagliato scarta un byte e si riallinea.
class FrameParser {
  constructor() {
    this.buffer = [];
  }

  push(bytes) {
    const frames = [];
    for (const b of bytes) this.buffer.push(b);
    while (this.buffer.length >= FRAME_LENGTH) {
      const start = this.buffer.indexOf(START);
      if (start === -1) {
        this.buffer = [];
        break;
      }
      if (start > 0) this.buffer.splice(0, start);
      if (this.buffer.length < FRAME_LENGTH) break;
      const frame = this.buffer.slice(0, FRAME_LENGTH);
      if (checksum(frame) === frame[8]) {
        frames.push({ cmd: frame[1], data: frame.slice(2, 8) });
        this.buffer.splice(0, FRAME_LENGTH);
      } else {
        this.buffer.splice(0, 1);
      }
    }
    return frames;
  }
}

// Risposta a 0x86: alcol in mg/100ml (byte alto, byte basso) e stato di allarme.
// 90 mg/100ml = 0,90 g/l, l'unità usata nei controlli su strada.
function parseResult(data) {
  const mgPer100ml = (data[0] << 8) | data[1];
  return { mgPer100ml, gramsPerLiter: mgPer100ml / 100, alarm: data[5] };
}

// ---- sensor.js ----
// Due "sensori" con la stessa interfaccia:
// - SerialSensor parla con il Winsen ZE29A vero via USB (Web Serial di Chrome/Edge);
// - MockSensor lo simula, per provare l'app senza hardware.
// runTest() guida un test completo e funziona con entrambi.

const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

class SerialSensor {
  constructor() {
    this.port = null;
    this.writer = null;
    this.parser = new FrameParser();
    this.waiting = []; // richieste in attesa di risposta: {cmd, resolve, reject, timer}
    this.connected = false;
    this.onDisconnect = null;
  }

  static supported() {
    return 'serial' in navigator;
  }

  // Al primo avvio Chrome chiede quale porta usare (serve un tocco sullo schermo);
  // dalle volte successive la ritrova da solo con getPorts().
  async connect({ askUser = false } = {}) {
    const ports = await navigator.serial.getPorts();
    this.port = ports[0] || (askUser ? await navigator.serial.requestPort() : null);
    if (!this.port) throw new Error('Nessun sensore autorizzato');
    await this.port.open({ baudRate: 9600, dataBits: 8, stopBits: 1, parity: 'none' });
    this.writer = this.port.writable.getWriter();
    this.connected = true;
    this.readLoop();
  }

  async readLoop() {
    const reader = this.port.readable.getReader();
    try {
      while (true) {
        const { value, done } = await reader.read();
        if (done) break;
        for (const frame of this.parser.push(value)) this.deliver(frame);
      }
    } catch (e) {
      console.warn('Lettura sensore interrotta', e);
    } finally {
      reader.releaseLock();
      this.connected = false;
      this.waiting.forEach((w) => w.reject(new Error('Sensore scollegato')));
      this.waiting = [];
      if (this.onDisconnect) this.onDisconnect();
    }
  }

  deliver(frame) {
    const i = this.waiting.findIndex((w) => w.cmd === frame.cmd);
    if (i === -1) return;
    const [w] = this.waiting.splice(i, 1);
    clearTimeout(w.timer);
    w.resolve(frame.data);
  }

  async send(cmd, data = [], timeoutMs = 1000) {
    if (!this.connected) throw new Error('Sensore non collegato');
    const reply = new Promise((resolve, reject) => {
      const timer = setTimeout(() => {
        this.waiting = this.waiting.filter((w) => w.timer !== timer);
        reject(new Error('Il sensore non risponde'));
      }, timeoutMs);
      this.waiting.push({ cmd, resolve, reject, timer });
    });
    await this.writer.write(buildCommand(cmd, data));
    return reply;
  }

  async getState() {
    return (await this.send(CMD.STATUS))[0];
  }

  async switchTo(state) {
    return (await this.send(CMD.SWITCH, [state]))[0] === 0x01;
  }

  async readResult() {
    return parseResult(await this.send(CMD.RESULT));
  }

  async setBlowTime(seconds) {
    return (await this.send(CMD.SET_BLOW_TIME, [seconds]))[0] === 0x01;
  }
}

// Simulazione con gli stessi stati e tempi del manuale.
// Il soffio si simula tenendo premuto lo schermo (o la barra spaziatrice):
// se si lascia prima del tempo il soffio risulta interrotto.
class MockSensor {
  constructor({ preheatMs = 10000 } = {}) {
    this.connected = true;
    this.state = STATE.IDLE;
    this.preheatMs = preheatMs;
    this.blowSeconds = 4;
    this.blowing = false;
    this.timer = null;
    this.result = null;
  }

  async connect() {}

  go(state, afterMs, next) {
    clearTimeout(this.timer);
    this.state = state;
    if (afterMs != null) this.timer = setTimeout(next, afterMs);
  }

  preheat() {
    this.go(STATE.PREHEAT, this.preheatMs, () => this.waitBlow());
  }

  waitBlow() {
    this.go(STATE.WAIT_BLOW, 60000, () => this.go(STATE.IDLE));
    if (this.blowing) this.startBlow();
  }

  startBlow() {
    this.go(STATE.BLOWING, this.blowSeconds * 1000, () => {
      // Valore finto tra 0 e 1,6 g/l, più spesso basso
      const gl = Math.round(Math.pow(Math.random(), 1.6) * 160);
      this.result = gl;
      this.go(STATE.CALCULATING, 2500, () => this.go(STATE.RESULT, 20000, () => this.go(STATE.IDLE)));
    });
  }

  setBlowing(on) {
    this.blowing = on;
    if (on && this.state === STATE.WAIT_BLOW) this.startBlow();
    if (!on && this.state === STATE.BLOWING) this.go(STATE.INTERRUPTED, 3000, () => this.preheat());
  }

  async getState() {
    return this.state;
  }

  async switchTo(state) {
    if (state === STATE.PREHEAT && (this.state === STATE.IDLE || this.state === STATE.RESULT)) {
      this.preheat();
      return true;
    }
    if (state === STATE.IDLE && this.state === STATE.RESULT) {
      this.go(STATE.IDLE);
      return true;
    }
    return false;
  }

  async readResult() {
    if (this.state !== STATE.RESULT) throw new Error('Risultato non disponibile');
    const mg = this.result;
    return { mgPer100ml: mg, gramsPerLiter: mg / 100, alarm: mg >= 80 ? 2 : mg >= 20 ? 1 : 0 };
  }

  async setBlowTime(seconds) {
    this.blowSeconds = seconds;
    return true;
  }
}

// Esegue un test completo: avvia la preparazione, segue gli stati e legge il risultato.
// onState(state) viene chiamata a ogni cambio di stato per aggiornare lo schermo.
// Restituisce {ok: true, result} oppure {ok: false, reason: 'timeout'|'interrupted'|'error'}.
async function runTest(sensor, { onState = () => {}, maxInterruptions = 3, pollMs = 400 } = {}) {
  let last = null;
  let interruptions = 0;
  const started = Date.now();
  try {
    let state = await sensor.getState();
    // Se il modulo sta ancora misurando il test precedente, aspetta che finisca (pochi secondi)
    while ([STATE.BLOWING, STATE.CALCULATING].includes(state)) {
      if (last == null) onState('busy');
      last = 'busy';
      if (Date.now() - started > 30000) return { ok: false, reason: 'error' };
      await sleep(pollMs);
      state = await sensor.getState();
    }
    // Il ciclo non si può interrompere (manuale): se aspetta ancora un soffio, il nuovo giocatore lo usa
    if ([STATE.IDLE, STATE.RESULT].includes(state) && !(await sensor.switchTo(STATE.PREHEAT))) {
      return { ok: false, reason: 'error' };
    }

    while (Date.now() - started < 120000) {
      state = await sensor.getState();
      if (state !== last) {
        if (state === STATE.INTERRUPTED) interruptions++;
        onState(state, { interruptions });
        last = state;
      }
      if (state === STATE.INTERRUPTED && interruptions >= maxInterruptions) return { ok: false, reason: 'interrupted' };
      if (state === STATE.RESULT) return { ok: true, result: await sensor.readResult() };
      if (state === STATE.IDLE) return { ok: false, reason: 'timeout' }; // nessun soffio per 1 minuto
      await sleep(pollMs);
    }
    return { ok: false, reason: 'timeout' };
  } catch (e) {
    console.error(e);
    return { ok: false, reason: 'error' };
  }
}

function enterVoucher() {
  let code = '';
  let error = '';
  let first = true;
  const render = () => {
    show(`<section class="screen ${first ? '' : 'still'}">
      <h2>Inserisci il codice del buono</h2>
      <div class="code-box">${(code + '______').slice(0, 6).split('').map((c) => `<span>${c === '_' ? '' : c}</span>`).join('')}</div>
      ${error ? `<p class="lead error">${error}</p>` : ''}
      <div class="keypad">
        ${[1, 2, 3, 4, 5, 6, 7, 8, 9].map((d) => `<button class="key" data-d="${d}">${d}</button>`).join('')}
        <button class="key" id="del">⌫</button><button class="key" data-d="0">0</button><button class="key ok" id="ok" ${code.length < 6 ? 'disabled' : ''}>OK</button>
      </div>
      <button class="ghost-btn" id="back">Indietro</button>
    </section>`);
    first = false;
    app.querySelectorAll('[data-d]').forEach((b) => b.addEventListener('click', () => {
      if (code.length < 6) code += b.dataset.d;
      error = '';
      render();
    }));
    on('del', () => { code = code.slice(0, -1); error = ''; render(); });
    on('back', home);
    on('ok', () => {
      const v = validVoucher(code);
      if (!v) { error = 'Codice non valido, già usato o scaduto.'; code = ''; render(); return; }
      startGame(v.tests, { voucher: code });
    });
  };
  render();
}

function choosePlayers() {
  let n = CONFIG.challenge.minPlayers;
  let first = true;
  const render = () => {
    show(`<section class="screen ${first ? '' : 'still'}">
      <h2>Quanti giocatori?</h2>
      <div class="stepper">
        <button class="round" id="minus" ${n <= CONFIG.challenge.minPlayers ? 'disabled' : ''}>−</button>
        <div class="count">${n}</div>
        <button class="round" id="plus" ${n >= CONFIG.challenge.maxPlayers ? 'disabled' : ''}>+</button>
      </div>
      <div class="dots">${PLAYER_COLORS.slice(0, n).map((c) => `<span style="background:${c}"></span>`).join('')}</div>
      <p class="lead">Totale: <strong>${euro(n * CONFIG.prices.perPlayer)}</strong>, paga uno per tutti</p>
      <div class="row">
        <button class="ghost-btn" id="back">Indietro</button>
        <button class="primary-btn" id="go">Continua</button>
      </div>
    </section>`);
    first = false;
    on('minus', () => { n--; render(); });
    on('plus', () => { n++; render(); });
    on('back', home);
    on('go', () => startGame(n));
  };
  render();
}

async function startGame(nPlayers, { voucher = null } = {}) {
  if (!(await sensorReady())) return home();
  const price = nPlayers === 1 ? CONFIG.prices.single : CONFIG.prices.perPlayer * nPlayers;
  game = {
    price,
    voucher,
    players: Array.from({ length: nPlayers }, (_, i) => ({
      name: nPlayers === 1 ? 'Tu' : `Giocatore ${i + 1}`,
      color: PLAYER_COLORS[i],
      result: null,
    })),
    current: 0,
  };
  rules();
}

// Prima di pagare: solo maggiorenni e niente sorsi negli ultimi minuti
function rules() {
  show(`<section class="screen rules">
    <h2>Prima di iniziare</h2>
    <ul class="rule-list">
      <li><span class="ico">${ICONS.adult}</span><span><strong>Solo per maggiorenni.</strong> Il gioco è riservato a chi ha ${CONFIG.minAge} anni o più.</span></li>
      <li><span class="ico">${ICONS.clock}</span><span><strong>NB: per un risultato più preciso</strong> aspetta ${CONFIG.minutesAfterLastSip} minuti dall'ultimo sorso e sciacqua la bocca con un po' d'acqua. L'alcol rimasto in bocca fa uscire un valore più alto.</span></li>
      <li><span class="ico">${ICONS.straw}</span><span><strong>Usa sempre una cannuccia nuova</strong>, la trovi accanto al totem.</span></li>
    </ul>
    <div class="row">
      <button class="ghost-btn" id="back">Indietro</button>
      <button class="primary-btn" id="ok">${game.players.length > 1 ? `Abbiamo tutti ${CONFIG.minAge} anni` : `Ho ${CONFIG.minAge} anni`}, avanti</button>
    </div>
  </section>`);
  on('back', home);
  on('ok', () => {
    if (!game.voucher) return pay();
    useVoucher(game.voucher);
    paid();
  });
}

function paid() {
  game.paidAt = Date.now();
  saveGame();
  playerTurn();
}

function pay() {
  show(`<section class="screen">
    <h2>Paga ${euro(game.price)}</h2>
    <div class="pay-icon">${ICONS.contactless}</div>
    <p class="lead">Avvicina carta, bancomat o telefono al lettore qui sotto.</p>
    ${CONFIG.mockPayment ? '<button class="primary-btn" id="paid">Simula pagamento riuscito</button>' : ''}
    <button class="ghost-btn" id="cancel">Annulla</button>
  </section>`);
  on('paid', paid);
  on('cancel', home);
  // Quando collegheremo il POS vero: chiamare paid() alla conferma del pagamento.
}

async function playerTurn() {
  const player = game.players[game.current];
  const wait = cooldownLeft();
  if (wait > 0) await cooldown(wait, player);
  test(player);
}

function cooldownLeft() {
  const c = CONFIG.cooldown;
  const need = (lastTest.gl >= c.highFrom ? c.afterHighSeconds : c.baseSeconds) * 1000;
  return Math.ceil((need - (Date.now() - lastTest.at)) / 1000);
}

const STEP_TEXT = {
  busy: { title: 'Un attimo…', sub: 'Il sensore sta chiudendo il test precedente.' },
  [STATE.PREHEAT]: { title: 'Prendi una cannuccia nuova', sub: 'Infilala nel tubo: il sensore si sta preparando.' },
  [STATE.WAIT_BLOW]: { title: 'Soffia ora!', sub: 'Con una cannuccia nuova nel tubo: forte e senza fermarti, finché la barra è piena.' },
  [STATE.BLOWING]: { title: 'Continua a soffiare…', sub: 'Non fermarti!' },
  [STATE.INTERRUPTED]: { title: 'Ti sei fermato troppo presto', sub: 'Nessun problema: tra un attimo riproviamo.' },
  [STATE.CALCULATING]: { title: 'Sto calcolando…', sub: 'Il verdetto sta arrivando.' },
};

async function test(player) {
  show(`<section class="screen test">
    <div class="player-chip" style="--c:${player.color}">${esc(player.name)}</div>
    <h2 id="step-title">Un attimo…</h2>
    <p class="lead" id="step-sub"></p>
    <div class="meter"><div class="meter-fill" id="fill"></div></div>
    ${useMock ? '<p class="demo-hint">Prova: tieni premuto lo schermo (o la barra spaziatrice) per simulare il soffio</p>' : ''}
  </section>`, { idle: false });

  const fill = document.getElementById('fill');
  const setFill = (pct, ms) => {
    fill.style.transition = ms ? `width ${ms}ms linear` : 'none';
    fill.style.width = pct + '%';
  };
  const fillOver = (ms) => {
    setFill(0);
    void fill.offsetWidth; // applica lo 0 prima di far partire l'animazione
    setFill(100, ms);
  };
  const onState = (state) => {
    const t = STEP_TEXT[state];
    if (!t) return;
    document.getElementById('step-title').textContent = t.title;
    document.getElementById('step-sub').textContent = t.sub;
    fill.className = 'meter-fill s' + state.toString(16);
    if (state === STATE.PREHEAT) fillOver(10000);
    if (state === STATE.WAIT_BLOW) setFill(0);
    if (state === STATE.BLOWING) fillOver(CONFIG.blowSeconds * 1000);
    if (state === STATE.INTERRUPTED) setFill(0);
    if (state === STATE.CALCULATING) setFill(100);
  };

  const outcome = await runTest(sensor, { onState });
  if (outcome.ok) {
    const gl = outcome.result.gramsPerLiter;
    player.result = gl;
    lastTest = { at: Date.now(), gl };
    countTest(gl);
    saveGame();
    result(player);
  } else {
    failure(outcome.reason, player);
  }
}

// Il sensore si è guastato dopo il pagamento: buono per i test non ancora fatti
function voucherScreen() {
  const tests = game.players.filter((p) => p.result == null && !p.skipped).length;
  const code = newVoucher(tests);
  clearSavedGame();
  show(`<section class="screen voucher-screen">
    <h2>Ops, il sensore non risponde</h2>
    <p class="lead">Non perdi quello che hai pagato: ecco un buono per <strong>${tests === 1 ? '1 test' : `${tests} test`}</strong>, valido ${CONFIG.voucherDays} giorni.</p>
    <div class="voucher">${code}</div>
    <div class="qr">${qrSvg('Buono MoonBox ' + code)}<span>Fotografa il codice o il QR</span></div>
    <p class="lead">Quando il totem torna attivo, tocca “Hai un buono?” nella schermata iniziale, oppure mostralo al personale.</p>
    <button class="primary-btn" id="ok">Ho salvato il codice</button>
  </section>`, { idle: false });
  on('ok', home);
}

// A metà sfida si aspetta di più prima di tornare all'inizio: gli altri giocatori hanno già pagato
function idleForTurn() {
  return game.current < game.players.length - 1 ? CONFIG.idleSecondsMidChallenge : true;
}

function failure(reason, player) {
  if (reason === 'error') {
    sensorProblem = 'Il sensore non risponde';
    voucherScreen();
    return;
  }
  const text = reason === 'interrupted'
    ? { title: 'Il soffio si è interrotto troppe volte.', tip: 'Riprova gratis: soffia forte e senza fermarti.' }
    : { title: 'Non abbiamo sentito il soffio.', tip: 'Controlla che la cannuccia sia infilata bene e riprova gratis: quando compare "Soffia ora!" hai un minuto.' };
  show(`<section class="screen">
    <div class="player-chip" style="--c:${player.color}">${esc(player.name)}</div>
    <h2>${text.title}</h2>
    <p class="lead">${text.tip}</p>
    <div class="row">
      <button class="ghost-btn" id="skip">${game.players.length > 1 ? 'Salta' : 'Esci'}</button>
      <button class="primary-btn" id="retry">Riprova</button>
    </div>
  </section>`, { idle: idleForTurn() });
  on('retry', () => test(player));
  on('skip', () => {
    player.skipped = true;
    saveGame();
    next();
  });
}

function result(player) {
  const band = bandFor(player.result);
  const isLast = game.current === game.players.length - 1;
  const multi = game.players.length > 1;
  show(`<section class="screen result">
    ${multi ? `<div class="player-chip" style="--c:${player.color}">${esc(player.name)}</div>` : ''}
    <div class="value">${formatGl(player.result)}</div>
    <div class="emoji">${band.emoji}</div>
    <h2 class="title">${esc(band.title)}</h2>
    <p class="lead">${esc(band.message)}</p>
    ${band.taxi ? `<div class="qr">${qrSvg(CONFIG.taxiLink)}<span>${esc(CONFIG.taxiLabel)}</span></div>` : ''}
    <button class="primary-btn" id="next">${!multi ? 'Fine' : isLast ? 'Vedi la classifica' : `Tocca a ${esc(game.players[game.current + 1].name)}`}</button>
    <p class="disclaimer">${esc(CONFIG.disclaimer)}</p>
  </section>`, { idle: idleForTurn() });
  on('next', next);
}

function next() {
  if (game.current < game.players.length - 1) {
    game.current++;
    saveGame();
    playerTurn();
  } else if (game.players.length > 1) {
    podium();
  } else {
    home();
  }
}

function podium() {
  const ranked = game.players.filter((p) => p.result != null).sort((a, b) => b.result - a.result);
  const anyTaxi = ranked.some((p) => bandFor(p.result).taxi);
  show(`<section class="screen podium">
    <h2>La classifica della serata</h2>
    <ol class="ranking">
      ${ranked.map((p, i) => `<li style="--c:${p.color}">
        <span class="pos">${i + 1}</span>
        <span class="name">${esc(p.name)}</span>
        <span class="t">${esc(bandFor(p.result).title)}</span>
        <span class="v">${formatGl(p.result)}</span>
      </li>`).join('')}
    </ol>
    ${anyTaxi ? `<p class="lead">Chi è in cima alla classifica stasera non guida.</p><div class="qr">${qrSvg(CONFIG.taxiLink)}<span>${esc(CONFIG.taxiLabel)}</span></div>` : ''}
    <button class="primary-btn" id="end">Fine</button>
    <p class="disclaimer">${esc(CONFIG.disclaimer)}</p>
  </section>`);
  on('end', home);
}

// Dopo un riavvio: riprende la partita pagata dal primo giocatore che non ha ancora soffiato
function resume(saved) {
  game = saved;
  game.current = game.players.findIndex((p) => p.result == null && !p.skipped);
  if (sensorProblem) return voucherScreen();
  const player = game.players[game.current];
  show(`<section class="screen">
    <h2>Riprendiamo da dove eravamo</h2>
    <p class="lead">Il totem si è riavviato, ma il pagamento è salvato.</p>
    ${game.players.length > 1 ? `<div class="player-chip" style="--c:${player.color}">Tocca a ${esc(player.name)}</div>` : ''}
    <button class="primary-btn" id="go">Continua</button>
  </section>`, { idle: false });
  on('go', playerTurn);
}

// ---------- impostazioni nascoste (5 tocchi in alto a sinistra, o tasto S) ----------
function settings() {
  const stats = store.get('stats', { total: 0, days: {} });
  const today = stats.days[new Date().toISOString().slice(0, 10)] || 0;
  const openVouchers = Object.entries(store.get('vouchers', {})).filter(([c]) => validVoucher(c));
  show(`<section class="screen settings">
    <h2>Impostazioni</h2>
    <p>Sensore: <strong>${useMock ? 'simulato' : 'Winsen ZE29A via USB'}</strong> · stato: <strong>${sensorProblem ? esc(sensorProblem) : 'pronto'}</strong></p>
    <div class="row">
      <button class="ghost-btn" id="mock">${useMock ? 'Usa il sensore vero' : 'Usa il sensore simulato'}</button>
      ${useMock ? '' : '<button class="primary-btn" id="connect">Collega sensore USB</button>'}
    </div>
    <p>Test oggi: <strong>${today}</strong> · test totali: <strong>${stats.total}</strong></p>
    <p>Buoni ancora validi: <strong>${openVouchers.length ? openVouchers.map(([c, v]) => `${c} (${v.tests} test)`).join(', ') : 'nessuno'}</strong></p>
    <button class="ghost-btn" id="close">Chiudi</button>
  </section>`, { idle: false });
  on('mock', async () => {
    useMock = !useMock;
    store.set('mockSensor', useMock);
    await setupSensor();
    settings();
  });
  on('connect', async () => {
    await setupSensor({ askUser: true });
    settings();
  });
  on('close', home);
}

let cornerTaps = [];
document.addEventListener('pointerdown', (e) => {
  if (idleSeconds) resetIdle();
  if (e.clientX < 80 && e.clientY < 80) {
    cornerTaps = [...cornerTaps.filter((t) => Date.now() - t < 3000), Date.now()];
    if (cornerTaps.length >= 5) { cornerTaps = []; settings(); }
  }
  if (useMock && sensor instanceof MockSensor && app.querySelector('.test')) sensor.setBlowing(true);
});
document.addEventListener('pointerup', () => {
  if (sensor instanceof MockSensor) sensor.setBlowing(false);
});
document.addEventListener('keydown', (e) => {
  if (e.key === 's' && !game) settings();
  if (e.code === 'Space' && sensor instanceof MockSensor && app.querySelector('.test')) { e.preventDefault(); sensor.setBlowing(true); }
});
document.addEventListener('keyup', (e) => {
  if (e.code === 'Space' && sensor instanceof MockSensor) sensor.setBlowing(false);
});
document.addEventListener('contextmenu', (e) => e.preventDefault()); // niente menu con la pressione lunga

setupSensor().then(() => {
  const saved = savedGame();
  if (saved) resume(saved);
  else home();
});

</script>
</body>
</html>
